name: SaaS-O-Matic CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/${{ github.repository }}/backend
  IMAGE_FRONTEND: ghcr.io/${{ github.repository }}/frontend

# Cancel in-progress runs for the same branch (save CI minutes)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────
  # JOB 1 — Quality Gate: Lint
  # Runs in parallel with the test jobs for speed
  # ─────────────────────────────────────────────────────────────────
  lint:
    name: 'Quality Gate — Lint'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            mic-saas-omatic/package-lock.json
            spa-saas-omatic/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix mic-saas-omatic ci

      - name: Install frontend dependencies
        run: npm --prefix spa-saas-omatic ci

      - name: Lint backend (ESLint)
        run: npm --prefix mic-saas-omatic run lint

      - name: Lint frontend (Oxlint)
        run: npm --prefix spa-saas-omatic run lint

  # ─────────────────────────────────────────────────────────────────
  # JOB 2 — Quality Gate: Backend Tests
  # ─────────────────────────────────────────────────────────────────
  test-backend:
    name: 'Quality Gate — Backend Tests (Jest)'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: mic-saas-omatic/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix mic-saas-omatic ci

      - name: Run backend unit tests
        run: npm --prefix mic-saas-omatic test -- --ci --coverage --forceExit

      - name: Publish backend coverage summary
        if: always()
        run: node scripts/coverage-summary.mjs "Backend (NestJS / Jest)" mic-saas-omatic/coverage/clover.xml

      - name: Upload backend coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: mic-saas-omatic/coverage/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────
  # JOB 3 — Quality Gate: Frontend Tests
  # ─────────────────────────────────────────────────────────────────
  test-frontend:
    name: 'Quality Gate — Frontend Tests (Vitest)'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: spa-saas-omatic/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix spa-saas-omatic ci

      - name: Run frontend unit tests
        run: npm --prefix spa-saas-omatic run test:coverage

      - name: Publish frontend coverage summary
        if: always()
        run: node scripts/coverage-summary.mjs "Frontend (Angular / Vitest)" spa-saas-omatic/coverage/dashboard/clover.xml

      - name: Upload frontend coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: spa-saas-omatic/coverage/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────
  # JOB 4 — Build Artifacts
  # Only runs if ALL quality gate jobs pass
  # ─────────────────────────────────────────────────────────────────
  build:
    name: 'Build — Compile & Bundle'
    runs-on: ubuntu-latest
    needs: [lint, test-backend, test-frontend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            mic-saas-omatic/package-lock.json
            spa-saas-omatic/package-lock.json

      - name: Install all dependencies
        run: |
          npm --prefix mic-saas-omatic ci
          npm --prefix spa-saas-omatic ci

      - name: Build backend (TypeScript → dist/)
        run: npm --prefix mic-saas-omatic run build

      - name: Build frontend (Angular → production bundle)
        run: npm --prefix spa-saas-omatic run build -- --configuration production

      - name: Upload backend dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: mic-saas-omatic/dist/
          retention-days: 1

      - name: Upload frontend dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: spa-saas-omatic/dist/
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────
  # JOB 5 — Docker: Build & Push Images
  # Only runs on push to main (not on PRs) after build passes
  # ─────────────────────────────────────────────────────────────────
  docker:
    name: 'Deploy — Build & Push Docker Images'
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write  # required to push to GitHub Container Registry (GHCR)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx (multi-platform builder)
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata for backend image
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BACKEND }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend image (multi-stage Node 22)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: mic-saas-omatic/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract Docker metadata for frontend image
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_FRONTEND }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push frontend image (Angular → Nginx Alpine)
        uses: docker/build-push-action@v6
        with:
          context: ./spa-saas-omatic
          file: spa-saas-omatic/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deployment summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Tag |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend  | \`${{ env.IMAGE_BACKEND }}:latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | \`${{ env.IMAGE_FRONTEND }}:latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Pull and run on any server:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker compose pull && docker compose up -d" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
