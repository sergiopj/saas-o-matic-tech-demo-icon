name: SaaS-O-Matic CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/${{ github.repository }}/backend
  IMAGE_FRONTEND: ghcr.io/${{ github.repository }}/frontend

# Cancel in-progress runs for the same branch (save CI minutes)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ═════════════════════════════════════════════════════════════════
  # TRACK 1: BACKEND QUALITY GATES
  # ═════════════════════════════════════════════════════════════════

  lint-backend:
    name: '1. Backend — Lint (ESLint)'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: mic-saas-omatic/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix mic-saas-omatic ci

      - name: Run backend linter
        run: npm --prefix mic-saas-omatic run lint

      - name: Validate Kubernetes manifests (IaC Kustomize)
        run: kubectl kustomize k8s/ > /dev/null

  test-backend:
    name: '2. Backend — Tests & Coverage (Jest)'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: mic-saas-omatic/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix mic-saas-omatic ci

      - name: Run backend unit tests with coverage
        run: npm --prefix mic-saas-omatic test -- --ci --coverage --forceExit

      - name: Publish backend coverage summary table
        if: always()
        run: node scripts/coverage-summary.mjs "Backend (NestJS / Jest)" mic-saas-omatic/coverage/clover.xml

      - name: Upload backend coverage report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: mic-saas-omatic/coverage/
          retention-days: 7

  build-backend:
    name: '3. Backend — Build (TypeScript → dist/)'
    runs-on: ubuntu-latest
    needs: [lint-backend, test-backend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: mic-saas-omatic/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix mic-saas-omatic ci

      - name: Build backend application
        run: npm --prefix mic-saas-omatic run build

      - name: Upload backend dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: mic-saas-omatic/dist/
          retention-days: 1

  deploy-backend:
    name: '4. Backend — Docker Image (GHCR)'
    runs-on: ubuntu-latest
    needs: [build-backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata for backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BACKEND }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend image (multi-stage Node 22)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: mic-saas-omatic/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ═════════════════════════════════════════════════════════════════
  # TRACK 2: FRONTEND QUALITY GATES
  # ═════════════════════════════════════════════════════════════════

  lint-frontend:
    name: '1. Frontend — Lint (Oxlint)'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: spa-saas-omatic/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix spa-saas-omatic ci

      - name: Run frontend linter
        run: npm --prefix spa-saas-omatic run lint

  test-frontend:
    name: '2. Frontend — Tests & Coverage (Vitest)'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: spa-saas-omatic/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix spa-saas-omatic ci

      - name: Run frontend unit tests with coverage
        run: npm --prefix spa-saas-omatic run test:coverage
        env:
          NO_COLOR: '1'

      - name: Publish frontend coverage summary table
        if: always()
        run: node scripts/coverage-summary.mjs "Frontend (Angular / Vitest)" spa-saas-omatic/coverage/dashboard/clover.xml

      - name: Upload frontend coverage report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: spa-saas-omatic/coverage/
          retention-days: 7

  build-frontend:
    name: '3. Frontend — Build (Angular Production Bundle)'
    runs-on: ubuntu-latest
    needs: [lint-frontend, test-frontend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: spa-saas-omatic/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix spa-saas-omatic ci

      - name: Build frontend production bundle
        run: npm --prefix spa-saas-omatic run build -- --configuration production

      - name: Upload frontend dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: spa-saas-omatic/dist/
          retention-days: 1

  deploy-frontend:
    name: '4. Frontend — Docker Image (GHCR)'
    runs-on: ubuntu-latest
    needs: [build-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata for frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_FRONTEND }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push frontend image (Angular → Nginx Alpine)
        uses: docker/build-push-action@v6
        with:
          context: ./spa-saas-omatic
          file: spa-saas-omatic/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
