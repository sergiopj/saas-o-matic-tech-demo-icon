<header class="navbar-header">
  <mat-toolbar class="navbar-toolbar">
    <div class="navbar-container">
      <!-- Left side: Mobile Hamburger Toggle + Brand Link -->
      <div class="navbar-brand-group">
        <button type="button" mat-icon-button class="mobile-menu-btn" (click)="toggleMobileMenu()"
          [attr.aria-expanded]="isMobileMenuOpen()" aria-controls="mobile-nav-panel"
          [attr.aria-label]="(isMobileMenuOpen() ? 'navbar.mobileMenu.close' : 'navbar.mobileMenu.open') | translate">
          <mat-icon>{{ isMobileMenuOpen() ? 'close' : 'menu' }}</mat-icon>
        </button>

        <!-- Brand & Title -->
        <a routerLink="/" class="brand-link" (click)="closeMobileMenu()"
          [attr.aria-label]="'navbar.home.aria' | translate">
          <div class="brand-icon-badge" aria-hidden="true">
            <svg class="brand-icon-svg" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="omaticBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#1061e2" />
                  <stop offset="50%" stop-color="#0ea5e9" />
                  <stop offset="100%" stop-color="#8b5cf6" />
                </linearGradient>
                <linearGradient id="omaticCoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#ffffff" />
                  <stop offset="100%" stop-color="#e0f2fe" />
                </linearGradient>
                <filter id="omaticGlow" x="-20%" y="-20%" width="140%" height="140%">
                  <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1061e2" flood-opacity="0.35" />
                </filter>
              </defs>
              <rect width="36" height="36" rx="10" fill="url(#omaticBrandGrad)" filter="url(#omaticGlow)" />
              <circle cx="18" cy="18" r="10.5" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="48 14" opacity="0.95" />
              <path d="M19.8 9.5L13.8 18H18L16.2 26.5L22.8 16.8H18.6L19.8 9.5Z" fill="url(#omaticCoreGrad)" />
            </svg>
          </div>
          <div class="brand-text">
            <span class="app-title">{{ 'navbar.title' | translate }}</span>
            <span class="app-subtitle">{{ 'navbar.subtitle' | translate }}</span>
          </div>
        </a>

        <!-- Transversal Theme Switcher (Top Left) -->
        <app-theme-toggle class="navbar-theme-toggle" />
      </div>

      <!-- Right Actions: Currency Selector + Decoupled Language Selector -->
      <div class="navbar-actions">
        <app-currency-selector />
        <app-language-selector />
      </div>
    </div>
  </mat-toolbar>

  <!-- Mobile Collapsible Top Navigation Dropdown Panel -->
  @if (isMobileMenuOpen()) {
  <div class="mobile-backdrop" (click)="closeMobileMenu()" (keydown.escape)="closeMobileMenu()" tabindex="-1"
    aria-hidden="true"></div>
  <nav id="mobile-nav-panel" class="mobile-nav-panel" [attr.aria-label]="'sidebar.aria' | translate">
    <ul class="mobile-nav-list">
      @for (item of navItems; track item.path) {
      <li class="mobile-nav-item">
        <a [routerLink]="item.path" routerLinkActive="active" class="mobile-nav-link" (click)="closeMobileMenu()">
          <mat-icon class="mobile-nav-icon" aria-hidden="true">{{ item.icon }}</mat-icon>
          <span class="mobile-nav-label">{{ item.labelKey | translate }}</span>
        </a>
      </li>
      }
    </ul>
  </nav>
  }
</header>
