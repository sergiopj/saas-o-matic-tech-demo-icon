apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: saas-omatic-backend-hpa
  namespace: saas-omatic
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: saas-omatic-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: saas-omatic-frontend-hpa
  namespace: saas-omatic
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: saas-omatic-frontend
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
