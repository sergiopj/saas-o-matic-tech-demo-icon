apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: saas-omatic-ingress
  namespace: saas-omatic
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  rules:
    - http:
        paths:
          # Frontend SPA (HTML5 PushState)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: saas-omatic-frontend-service
                port:
                  number: 80
          # Backend REST Endpoints
          - path: /customers
            pathType: Prefix
            backend:
              service:
                name: saas-omatic-backend-service
                port:
                  number: 3000
          - path: /simulations
            pathType: Prefix
            backend:
              service:
                name: saas-omatic-backend-service
                port:
                  number: 3000
          - path: /invoices
            pathType: Prefix
            backend:
              service:
                name: saas-omatic-backend-service
                port:
                  number: 3000
          - path: /emails
            pathType: Prefix
            backend:
              service:
                name: saas-omatic-backend-service
                port:
                  number: 3000
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: saas-omatic-backend-service
                port:
                  number: 3000
